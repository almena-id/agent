[project]
name = "almena-agent"
version = "0.1.0"
description = "AI agent of the Almena Network, reachable over the Agent2Agent (A2A) protocol"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[fastapi]>=1.1.5",
    "anthropic>=1.9.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "scalar-fastapi>=1.9.1",
]

[project.scripts]
almena-agent = "almena_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
