<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$name</title>
<meta name="description" content="$description">
<link rel="icon" type="image/svg+xml" href="$favicon">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/chakra-petch-600.woff2" as="font" type="font/woff2" crossorigin>
<style>$css</style>
</head>
<body>
<header><div class="frame">
<a class="wordmark" href="/" aria-label="Almena Agent"><span class="mark">$logo</span><span>Almena <strong>Agent</strong></span></a>
</div></header>
<main class="frame">
<span class="status ok">Operational</span>
<h1>Almena <span>Agent</span></h1>
<p class="lead">$description It answers other agents over the Agent2Agent (A2A) protocol.</p>
<dl>
<dt>Version</dt><dd><code>$version</code></dd>
<dt>Protocol</dt><dd>A2A $protocol</dd>
<dt>Agent card</dt><dd><code>$card_url</code></dd>
</dl>
</main>
<footer><div class="frame">
<span class="name"><span class="mark">$small</span>Almena Agent</span>
<span>© $year Almena Network · <a href="https://almena.id">almena.id</a></span>
</div></footer>
</body>
</html>
