name: almena-agent

services:
  agent:
    build:
      context: .
    image: almena-agent:dev
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8100}:8100"
    environment:
      AGENT_ENVIRONMENT: ${AGENT_ENVIRONMENT:-production}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-https://agent.almena.id}
      AGENT_NAME: ${AGENT_NAME:-Almena Agent}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-The AI agent of Almena ID.}
      AGENT_PROVIDER_ORGANIZATION: ${AGENT_PROVIDER_ORGANIZATION:-Almena ID}
      AGENT_PROVIDER_URL: ${AGENT_PROVIDER_URL:-https://almena.id}
      # Docker's networks: trust X-Forwarded-* from a reverse proxy on them.
      AGENT_FORWARDED_ALLOW_IPS: ${AGENT_FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
      AGENT_EFFORT: ${AGENT_EFFORT:-high}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-64000}
      AGENT_SYSTEM_PROMPT: ${AGENT_SYSTEM_PROMPT:-}
      AGENT_HISTORY_TURNS: ${AGENT_HISTORY_TURNS:-50}
      AGENT_REGISTRY_MCP_URL: ${AGENT_REGISTRY_MCP_URL-https://api.almena.id/mcp}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-20}

  caddy:
    # Caddy with the Cloudflare DNS module, for the DNS-01 challenge (Caddyfile).
    # The same image as ../mediator's and ../develop's.
    build:
      dockerfile_inline: |
        FROM caddy:2-builder-alpine AS builder
        RUN xcaddy build --with github.com/caddy-dns/cloudflare
        FROM caddy:2-alpine
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    image: almena-caddy:dev
    restart: unless-stopped
    environment:
      # The Caddyfile's site.
      AGENT_DOMAIN: ${AGENT_DOMAIN:-}
      # Writes the challenge's TXT record in the domain's Cloudflare zone.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account, on the host (git-ignored) so they
      # survive removing the containers and their volumes.
      - ./caddy:/data
      - caddy-config:/config
    depends_on:
      agent:
        condition: service_healthy

volumes:
  caddy-config:
