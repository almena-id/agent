name: almena-agent

services:
  agent:
    build:
      context: .
    image: almena-agent:dev
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8100}:8100"
    environment:
      AGENT_ENVIRONMENT: ${AGENT_ENVIRONMENT:-production}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-https://agent.almena.id}
      AGENT_NAME: ${AGENT_NAME:-Almena Agent}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-The AI agent of the Almena Network.}
      AGENT_PROVIDER_ORGANIZATION: ${AGENT_PROVIDER_ORGANIZATION:-Almena Network}
      AGENT_PROVIDER_URL: ${AGENT_PROVIDER_URL:-https://almena.network}
      # Docker's networks: trust X-Forwarded-* from a reverse proxy on them.
      AGENT_FORWARDED_ALLOW_IPS: ${AGENT_FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
      AGENT_EFFORT: ${AGENT_EFFORT:-high}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-64000}
      AGENT_SYSTEM_PROMPT: ${AGENT_SYSTEM_PROMPT:-}
      AGENT_HISTORY_TURNS: ${AGENT_HISTORY_TURNS:-50}
